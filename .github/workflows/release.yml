# P0.1: Release-Automatik – Git-Tag vX.Y.Z baut & veröffentlicht das Image.
# Damit ist `docker compose pull && docker compose up -d` der reale Update-Pfad.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Version aus Tag ableiten
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Konsistenz prüfen (Tag == securats/version.py == CHANGELOG)
        run: |
          set -e
          CODE_V=$(python -c "import re;print(re.search(r'\"([^\"]+)\"', open('securats/version.py').read()).group(1))")
          test "$CODE_V" = "${{ steps.v.outputs.version }}" || { echo "Tag v${{ steps.v.outputs.version }} != version.py ($CODE_V)"; exit 1; }
          grep -q "\[${{ steps.v.outputs.version }}\]" CHANGELOG.md || { echo "CHANGELOG-Eintrag fehlt"; exit 1; }

      - name: Tests
        run: |
          pip install -r requirements.txt
          python manage.py test

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            SECURATS_VERSION=${{ steps.v.outputs.version }}
          tags: |
            ghcr.io/lusoluc/ats:${{ steps.v.outputs.version }}
            ghcr.io/lusoluc/ats:latest

      - name: GitHub-Release mit CHANGELOG-Auszug
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          body_path: CHANGELOG.md
