name: securats

services:
  # ============================================================================
  # 1. Consolidated Unified Django Web Application
  # ============================================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: securats-django:latest
    container_name: securats-django
    restart: always
    ports:
      - "3000:8000"  # Maps career portal externally to port 3000 (previously next.js)
    volumes:
      - ./shared:/app/shared
      - ./media:/app/media
    environment:
      - PORT=8000
      - DATABASE_URL=file:/app/shared/dev.db
      - DEBUG=False
      - DJANGO_SECRET_KEY=enterprise-secret-key-super-secure-change-me
      - PII_ENCRYPTION_KEY=securats-fallback-super-secure-encryption-key-for-pii-at-rest=
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - securats-network

networks:
  securats-network:
    driver: bridge
