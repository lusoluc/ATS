# Zentrale Werkzeug-Konfiguration (Ruff-Linter).
# Regelauswahl bewusst schlank: Fehlerklassen (F), Stil-Basics (E/W),
# Bugbear-Fallen (B), Modernisierung (UP), Import-Sortierung (I).
[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["ats/migrations", "legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
ignore = [
    "E501", # Zeilenlänge: Bestandscode hat lange Strings/Queries; kein Umbruch-Zwang
]

[tool.ruff.lint.per-file-ignores]
# Paket-Fassaden re-exportieren bewusst (z. B. ats/views/__init__.py für URL-Auflösung)
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["ats", "securats"]

# Schrittweise Typisierung: Basis-Checks projektweit, strenge Pflicht-
# Annotationen nur in den bereits typisierten Kernmodulen (Overrides unten).
[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
exclude = ["^legacy/", "^ats/migrations/"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "securats.settings"

# Bereits voll typisierte Kernmodule: hier sind Annotationen Pflicht.
# Neue typisierte Module in diese Liste aufnehmen.
[[tool.mypy.overrides]]
module = [
    "ats.approvals",
    "ats.audit",
    "ats.blocks",
    "ats.board_insights",
    "ats.dsgvo",
    "ats.panel",
    "ats.pay_transparency",
    "ats.inbox_intents",
    "ats.permissions",
    "ats.reply_drafts",
    "ats.talent_pool",
    "ats.timeline",
]
disallow_untyped_defs = true
check_untyped_defs = true
