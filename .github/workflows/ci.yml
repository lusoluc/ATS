# Kontinuierliche Prüfung: Läuft bei JEDEM Push und Pull Request auf main.
# Zweck (Anforderung Carlos): Alles, was in der Test- und Audit-Arbeit
# abgesichert wurde – inkl. der Wächter-Tests (Guardrails), die ganze
# FehlerKLASSEN prüfen – wird automatisch erneut geprüft, sobald der Code
# erweitert, ergänzt oder verändert wird. Die Release-Automatik
# (release.yml) bleibt davon unberührt und greift zusätzlich beim Taggen.
name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}   # manuell auslösbar

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff (Linter)
    runs-on: ubuntu-latest
    # Ohne Deckel haengt ein Job, den GitHub keinem Runner zuteilt, bis zum
    # 6-Stunden-Limit. Am 06.08.2026 blieben mehrere Laeufe 10-15 Minuten in
    # der Warteschlange stecken und meldeten am Ende "not acquired by Runner
    # of type hosted" – ein Deckel macht daraus einen schnellen, klaren Abbruch.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          # Fehlte hier als einzigem Job – jeder Lauf installierte die
          # Werkzeuge neu.
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Ruff Lint
        run: ruff check .

  typecheck:
    name: mypy (Typpruefung)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DJANGO_SECRET_KEY: "ci-only-secret-key"
      PII_ENCRYPTION_KEY: "ci-only-pii-key"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: mypy
        run: mypy ats securats

  test:
    name: Tests, Migrationen & Sicherheits-Wächter
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Produktionsnahes DB-Backend (PostgreSQL), damit die
    # Verschlüsselungs-/at-rest-Tests unter realistischen Bedingungen laufen.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: securats
          POSTGRES_PASSWORD: securats
          POSTGRES_DB: securats
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Feste, nur für CI genutzte Schlüssel (keine echten Secrets).
      DEBUG: "False"
      # Mindestens 50 Zeichen und genug Varianz: Sonst meldet der
      # Deploy-Check W009 – eine Warnung ueber den CI-Schluessel, die echte
      # Befunde verdeckt hätte.
      DJANGO_SECRET_KEY: "ci-only-key-4Jq7Rz1PmXw9Bs2Ky6Vt0Nc3Hd8Lf5Gr-not-used-in-production"
      PII_ENCRYPTION_KEY: "ci-only-pii-key-deterministic-for-tests"
      POSTGRES_HOST: "127.0.0.1"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "securats"
      POSTGRES_USER: "securats"
      POSTGRES_PASSWORD: "securats"
      # ALLOWED_HOSTS für den System-Check unter DEBUG=False
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      # Wie eine sauber eingerichtete Produktion hinter TLS-Proxy (INSTALL.md).
      SECURE_SSL_REDIRECT: "True"
      SECURE_HSTS_PRELOAD: "True"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django System-Check (Deploy-Modus)
        # Vorher stand hier `... --fail-level WARNING || python manage.py check`.
        # Der Schritt hiess "Deploy-Modus" und KONNTE nicht fehlschlagen: Jede
        # Sicherheitswarnung fiel auf den harmlosen Normal-Check zurueck. Die
        # Umgebung oben setzt jetzt das, was INSTALL.md fuer Produktion
        # verlangt – damit ist die Pruefung eine Aussage statt einer Geste.
        run: python manage.py check --deploy --fail-level WARNING

      - name: Fehlende Migrationen erkennen
        # Schlägt fehl, wenn ein Modell geändert wurde, aber die Migration fehlt.
        run: python manage.py makemigrations --check --dry-run

      - name: Migrationen anwenden
        run: python manage.py migrate --noinput

      - name: Cache-Tabelle (DB-Cache für Login-Lockout)
        run: python manage.py createcachetable securats_cache || true

      - name: Vollständige Testsuite (inkl. Sicherheits-Wächter)
        run: python manage.py test --verbosity=1

  guardrails:
    name: Sicherheits-Wächter isoliert (schneller Vorlauf)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DJANGO_SECRET_KEY: "ci-only-secret-key"
      PII_ENCRYPTION_KEY: "ci-only-pii-key"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Frueher standen hier VIER handverlesene Klassen, waehrend das Projekt
      # inzwischen ueber zwanzig Waechter hat – der Job versprach ein "klares
      # Ja/Nein zu den abgesicherten FehlerKLASSEN" und deckte keine
      # Viertel davon ab. Jetzt laufen alle, auch die beiden, die ausserhalb
      # von test_guardrails.py wohnen.
      - name: Wächter-Tests
        run: |
          python manage.py test \
            ats.tests.test_guardrails \
            ats.tests.test_pay_transparency.GuardrailPayTransparencyTestCase \
            ats.tests.test_laufzeit.GuardrailNoWeakHasherInSettingsTestCase \
            ats.tests.test_helles_branding.GuardrailDarkOnlyControlsTestCase \
            --verbosity=1
