{% if brand %}
<style id="brand-css">
  /* Corporate Identity des Traegers – ueberschreibt die SecurATS-Tokens
     NUR auf oeffentlichen Seiten. Kontrastfarben sind vorberechnet (WCAG). */
  :root {
    --primary: {{ brand.primary }};
    --primary-light: {{ brand.primary }};
    --primary-rgb: 0, 0, 0;
    --accent: {{ brand.accent }};
    --accent-light: {{ brand.accent }};
    {% if brand.mode == 'LIGHT' %}
    --bg-color: #f5f7fa;
    --bg-gradient: linear-gradient(180deg, #ffffff 0%, #f5f7fa 100%);
    --surface-color: #ffffff;
    --surface-hover: #eef1f6;
    --text-main: #1f2937;
    --text-muted: #4b5563;
    --glass-bg: rgba(255, 255, 255, 0.92);
    --glass-border: rgba(15, 23, 42, 0.10);
    --glass-glow: rgba(0, 0, 0, 0.04);
    --border-color: rgba(15, 23, 42, 0.12);
    --shadow-md: 0 4px 16px rgba(15, 23, 42, 0.08);
    --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.12);
    {% endif %}
  }

  /* ----------------------------------------------------
     Universal Button Overrides (Both Light & Dark Modes)
     ---------------------------------------------------- */
  .btn-cta, .btn-search, .btn-primary {
    background: var(--primary) !important;
    color: {{ brand.on_primary }} !important;
    box-shadow: none !important;
  }
  .btn-cta:hover, .btn-search:hover, .btn-primary:hover {
    background: {{ brand.primary_dark }} !important;
  }

  .btn-secondary-cta {
    border: 1px solid var(--primary) !important;
    background: transparent !important;
    color: var(--primary) !important;
    box-shadow: none !important;
  }
  .btn-secondary-cta:hover {
    background: var(--primary) !important;
    color: {{ brand.on_primary }} !important;
  }

  .badge-primary {
    background: {{ brand.primary }}1f !important;
    color: var(--primary) !important;
    border-color: {{ brand.primary }}55 !important;
  }
  a {
    color: var(--primary);
  }
  .nav-item a {
    color: var(--text-muted);
  }

  /* ----------------------------------------------------
     Light Theme Specific Overrides
     ---------------------------------------------------- */
  {% if brand.mode == 'LIGHT' %}
  body {
    background: var(--bg-color);
    color: var(--text-main);
  }
  .ambient-glow-1, .ambient-glow-2 {
    display: none !important;
  }
  header {
    background: rgba(255,255,255,0.92);
    border-bottom-color: var(--border-color);
  }
  .logo, .footer-logo {
    color: var(--primary) !important;
  }
  a:not([class]) { color: var(--primary); }
  footer {
    background: #ffffff;
  }

  /* Formularfelder. Diese Liste hatte sie ausgelassen – Karten, Titel, Tabs
     und Footer wurden umgestellt, die Eingabefelder nicht. Sie behielten die
     dunklen Werte aus base.html (`rgba(11,13,25,0.5)` mit weisser Schrift):
     auf hellem Grund ein grauer Kasten mit weisser Schrift, rund 3,6:1 statt
     der geforderten 4,5:1. Betroffen war das Bewerbungsformular – also der
     eine Bildschirm, an dem Bewerbende ihre Daten eintippen. */
  .form-input, .form-textarea, .input, .textarea,
  select.form-input, select.input, .filter-select,
  input[type="file"]:not(.file-upload-input) {
    background: var(--surface-color) !important;
    border-color: var(--border-color) !important;
    color: var(--text-main) !important;
  }
  .form-input::placeholder, .form-textarea::placeholder,
  .input::placeholder, .textarea::placeholder {
    color: var(--text-muted) !important;
  }
  .form-input:focus, .form-textarea:focus,
  .input:focus, .textarea:focus {
    background: var(--surface-color) !important;
    border-color: var(--primary) !important;
  }
  /* Die Dropzone des Lebenslauf-Uploads liegt ueber einem hellen Panel. */
  .file-upload-wrapper {
    background: var(--surface-hover) !important;
    border-color: var(--border-color) !important;
  }
  .file-upload-text, .file-upload-info {
    color: var(--text-main) !important;
  }

  /* Title Contrast Overrides */
  .section-title {
    color: var(--text-main) !important;
  }
  .section-subtitle {
    color: var(--text-muted) !important;
  }

  /* Hero Section Title — solide Farbe, keine Verläufe in Schrift */
  .hero-content h1 {
    color: var(--text-main) !important;
  }

  /* Tech Cards & Cards in Light Mode */
  .tech-card {
    background: var(--surface-color) !important;
    border: 1px solid var(--border-color) !important;
    box-shadow: var(--shadow-md) !important;
  }
  .tech-card:hover {
    box-shadow: var(--shadow-lg) !important;
    border-color: var(--primary) !important;
  }
  .tech-card h3 {
    color: var(--text-main) !important;
  }
  .tech-card p {
    color: var(--text-muted) !important;
  }

  /* Pricing Teaser */
  .pricing-teaser {
    background: var(--surface-color) !important;
    border: 1px solid var(--border-color) !important;
    box-shadow: var(--shadow-md) !important;
  }
  .pricing-teaser h2 {
    color: var(--text-main) !important;
  }
  .pricing-teaser p {
    color: var(--text-muted) !important;
  }

  /* Persona Selector (Tabs) */
  .persona-tab {
    background: var(--surface-hover) !important;
    color: var(--text-muted) !important;
    border: 1px solid var(--border-color) !important;
  }
  .persona-tab:hover {
    background: var(--surface-color) !important;
    color: var(--primary) !important;
    border-color: var(--primary) !important;
  }
  .persona-tab.active {
    background: var(--primary) !important;
    color: {{ brand.on_primary }} !important;
    border-color: var(--primary) !important;
  }
  .persona-meta h3, .persona-features h4 {
    color: var(--text-main) !important;
  }
  .use-case-item span {
    color: var(--text-main) !important;
  }

  /* Public Pages Titles & Content */
  .job-card-title, .detail-title, .detail-block h2, .contact-name, .apply-header h1, .screening-block h3 {
    color: var(--text-main) !important;
  }
  .detail-list-item, .contact-quote, .checkbox-label, .screening-question-label {
    color: var(--text-main) !important;
  }
  .contact-quote {
    background: var(--surface-hover) !important;
  }
  .job-card-teaser {
    color: var(--text-muted) !important;
  }
  {% endif %}
</style>
{% endif %}
